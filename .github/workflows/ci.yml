name: MINDCRAFT CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-ai:
    name: Reinforcement Learning & Advanced AI Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install AI Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest training/tests/test_env_and_model.py ml/tests/test_advanced_ai_suite.py -v

      - name: Verify Model Export Parity
        run: |
          python training/scripts/export.py

  build-web:
    name: Web Application Build & Typecheck
    runs-on: ubuntu-latest
    needs: test-ai

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm install

      - name: Generate Prisma Client
        working-directory: apps/web
        run: npx prisma generate

      - name: Build Next.js Web App
        working-directory: apps/web
        env:
          DATABASE_URL: "postgresql://neondb_owner:npg_mock@ep-purple-king.neon.tech/neondb?sslmode=require"
          DIRECT_URL: "postgresql://neondb_owner:npg_mock@ep-purple-king.neon.tech/neondb?sslmode=require"
          JWT_SECRET: "ci_pipeline_dummy_jwt_secret_key_minimum_32_characters"
          NODE_ENV: "production"
        run: npm run build
