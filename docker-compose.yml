version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: mindcraft_user
      POSTGRES_PASSWORD: mindcraft_password
      POSTGRES_DB: mindcraft
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
